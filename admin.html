<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAIDARA AI — Admin</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #ffffff; color: #1f1f1f; padding: 24px 16px; }
    .container { max-width: 820px; margin: 0 auto; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
    h1 { margin: 0; font-size: 22px; }
    .link-btn { border: 1px solid #dde3ea; background: #ffffff; color: #1f1f1f; padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 600; }
    .auth-box { border: 1px solid #e2e8f0; background: #f8fafd; border-radius: 16px; padding: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
    .field label { font-size: 12px; font-weight: 600; color: #334155; }
    .field input { border: 1px solid #cbd5e1; border-radius: 10px; padding: 9px 12px; font-size: 14px; background: #ffffff; }
    .btn { border: none; background: #0b57d0; color: #ffffff; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .msg { font-size: 13px; margin-bottom: 14px; color: #dc2626; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 10px 8px; text-align: left; }
    th { background: #f8fafd; font-weight: 700; }
    .action-btn { border: 1px solid #cbd5e1; background: #ffffff; padding: 5px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-right: 4px; }
    .approve { border-color: #86efac; color: #15803d; background: #f0fdf4; }
    .reject { border-color: #fca5a5; color: #b91c1c; background: #fef2f2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <h1>Gestion des paiements — HAIDARA AI</h1>
      <a href="/" class="link-btn">Retour au chat</a>
    </div>

    <div class="auth-box">
      <div class="field">
        <label>Numéro de téléphone admin</label>
        <input id="adminPhone" type="text" value="+224629600906" placeholder="Ex: +224629600906" />
      </div>
      <div class="field">
        <label>Mot de passe admin</label>
        <input id="adminPass" type="password" value="sitan@" placeholder="Mot de passe" />
      </div>
      <button type="button" class="btn" onclick="loadList()">Charger</button>
    </div>

    <div id="msg" class="msg"></div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Numéro</th>
          <th>Offre</th>
          <th>Montant</th>
          <th>Référence</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    function creds() {
      return {
        phone: document.getElementById("adminPhone").value.trim(),
        password: document.getElementById("adminPass").value
      };
    }

    async function loadList() {
      const msg = document.getElementById("msg");
      const tbody = document.getElementById("rows");
      msg.textContent = "";
      try {
        const res = await fetch("/api/admin/payments", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(creds())
        });
        const data = await res.json();
        if (!res.ok) {
          tbody.innerHTML = "";
          msg.textContent = data.detail || "Accès refusé.";
          return;
        }
        renderRows(data.payments || []);
      } catch {
        msg.textContent = "Erreur réseau.";
      }
    }

    async function setStatus(paymentId, status) {
      const msg = document.getElementById("msg");
      msg.textContent = "";
      try {
        const res = await fetch("/api/admin/payments/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...creds(), payment_id: paymentId, status })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.detail || "Mise à jour impossible.";
          return;
        }
        loadList();
      } catch {
        msg.textContent = "Erreur réseau.";
      }
    }

    function renderRows(items) {
      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      items.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.id}</td>
          <td>${p.phone}</td>
          <td>${p.plan}</td>
          <td>${p.amount}</td>
          <td>${p.reference}</td>
          <td><b>${p.status}</b></td>
          <td>
            <button type="button" class="action-btn approve" onclick="setStatus('${p.id}', 'approved')">Valider</button>
            <button type="button" class="action-btn reject" onclick="setStatus('${p.id}', 'rejected')">Refuser</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
