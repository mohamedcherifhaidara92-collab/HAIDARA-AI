<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAIDARA AI</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#7c3aed" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 65% 20%, rgba(139, 92, 246, 0.22), transparent 38%),
        #0d091b;
      color: #f5f3ff;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 245px;
      background: #090613;
      border-right: 1px solid rgba(167, 139, 250, 0.18);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 1.02rem;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #a855f7;
      box-shadow: 0 0 12px #a855f7;
    }

    .new-btn {
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid rgba(168, 85, 247, 0.5);
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      color: #fff;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: left;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .hist-btn {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #c4b5fd;
      text-align: left;
      font-size: 0.84rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hist-btn:hover { background: rgba(139, 92, 246, 0.14); }
    .hist-btn.active {
      background: rgba(139, 92, 246, 0.25);
      border-color: rgba(167, 139, 250, 0.4);
      color: #fff;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 54px;
      padding: 0 18px;
      background: rgba(17, 12, 34, 0.9);
      border-bottom: 1px solid rgba(167, 139, 250, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.2);
      color: #e9d5ff;
      border: 1px solid rgba(167, 139, 250, 0.35);
    }

    .chat-board {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-row { display: flex; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 84%;
      padding: 14px 18px;
      border-radius: 15px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: linear-gradient(135deg, #6d28d9, #4338ca);
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .msg-row.assistant .bubble {
      background: #1b1332;
      border: 1px solid rgba(167, 139, 250, 0.25);
      color: #f5f3ff;
      border-bottom-left-radius: 4px;
    }

    .bubble h2, .bubble h3 {
      margin: 10px 0 6px;
      color: #e9d5ff;
      font-size: 1.05rem;
    }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul { margin: 6px 0 10px 20px; }
    .bubble li { margin-bottom: 4px; }
    .bubble code {
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 5px;
      border-radius: 5px;
      font-family: Consolas, monospace;
      font-size: 0.88rem;
    }
    .bubble pre {
      background: #0b0718;
      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 9px;
      padding: 10px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: Consolas, monospace;
      font-size: 0.86rem;
    }
    .bubble img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 8px;
      display: block;
    }

    .composer-area {
      padding: 10px 18px 18px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .file-pill {
      display: none;
      margin-bottom: 8px;
      padding: 7px 12px;
      border-radius: 9px;
      background: #1e1538;
      border: 1px solid rgba(167, 139, 250, 0.3);
      font-size: 0.83rem;
      align-items: center;
      justify-content: space-between;
    }

    .file-pill.visible { display: flex; }

    .composer-box {
      background: #18102e;
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      min-height: 26px;
      max-height: 150px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tools-left { display: flex; gap: 6px; flex-wrap: wrap; }

    .tool-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(167, 139, 250, 0.25);
      background: rgba(255, 255, 255, 0.05);
      color: #e9d5ff;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .tool-btn.active {
      background: #7c3aed;
      border-color: #c084fc;
      color: #fff;
    }

    .send-btn {
      padding: 8px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>HAIDARA AI</span>
    </div>

    <button type="button" class="new-btn" id="newChatBtn">+ Nouvelle discussion</button>

    <div style="font-size:0.72rem;color:#a59ec4;letter-spacing:0.06em;">DISCUSSIONS</div>
    <div class="history" id="historyList"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <strong>HAIDARA AI</strong>
      <span class="status-badge" id="statusBadge">Prêt</span>
    </header>

    <div class="chat-board" id="chatBoard"></div>

    <div class="composer-area">
      <div class="file-pill" id="filePill">
        <span id="fileNameLabel"></span>
        <button type="button" id="removeFileBtn" style="background:none;border:none;color:#f87171;font-weight:bold;cursor:pointer;">✕</button>
      </div>

      <form class="composer-box" id="chatForm">
        <input type="file" id="fileInput" style="display:none;" />
        <textarea id="promptInput" rows="1" placeholder="Écris ton message ou ton questionnaire ici..."></textarea>
        <div class="toolbar">
          <div class="tools-left">
            <button type="button" class="tool-btn" id="pickFileBtn">📎 Fichier</button>
            <button type="button" class="tool-btn" id="pickImgBtn">🖼 Image</button>
            <button type="button" class="tool-btn" id="makeImgBtn">✨ Créer image</button>
          </div>
          <button type="submit" class="send-btn" id="sendBtn">Envoyer</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "haidara_ai_sessions_v1";
    const chatBoard = document.getElementById("chatBoard");
    const historyList = document.getElementById("historyList");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const statusBadge = document.getElementById("statusBadge");
    const fileInput = document.getElementById("fileInput");
    const pickFileBtn = document.getElementById("pickFileBtn");
    const pickImgBtn = document.getElementById("pickImgBtn");
    const makeImgBtn = document.getElementById("makeImgBtn");
    const filePill = document.getElementById("filePill");
    const fileNameLabel = document.getElementById("fileNameLabel");
    const removeFileBtn = document.getElementById("removeFileBtn");

    function loadSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      } catch (e) {}
      return [{ id: "s1", title: "Session 1", messages: [] }];
    }

    let sessions = loadSessions();
    let activeSessionId = sessions[0].id;
    let attachedFile = null;
    let imageGenMode = false;

    function saveSessions() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      } catch (e) {}
    }

    function getActiveSession() {
      return sessions.find((s) => s.id === activeSessionId) || sessions[0];
    }

    function renderRichText(raw) {
      let safe = String(raw || "")
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">");

      safe = safe.replace(/```([\s\S]*?)```/g, "<pre>$1</pre>");
      safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      safe = safe.replace(/^###\s+(.*)$/gm, "<h3>$1</h3>");
      safe = safe.replace(/^##\s+(.*)$/gm, "<h2>$1</h2>");
      safe = safe.replace(/^\*\s+(.*)$/gm, "• $1");
      safe = safe.replace(/^-\s+(.*)$/gm, "• $1");
      safe = safe.replace(/\n/g, "<br>");
      return safe;
    }

    function appendBubble(role, text, imageUrl) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (text) {
        if (role === "assistant") {
          bubble.innerHTML = renderRichText(text);
        } else {
          bubble.textContent = text;
        }
      }
      if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = "Image HAIDARA AI";
        bubble.appendChild(img);
      }

      row.appendChild(bubble);
      chatBoard.appendChild(row);
      chatBoard.scrollTop = chatBoard.scrollHeight;
      return bubble;
    }

    function renderHistory() {
      historyList.innerHTML = "";
      sessions.forEach((s) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "hist-btn" + (s.id === activeSessionId ? " active" : "");
        btn.textContent = s.title;
        btn.onclick = () => {
          activeSessionId = s.id;
          renderHistory();
          renderBoard();
        };
        historyList.appendChild(btn);
      });
    }

    function renderBoard() {
      chatBoard.innerHTML = "";
      const s = getActiveSession();
      if (!s.messages.length) {
        appendBubble("assistant", "Bonjour ! Écris ton message ou ton questionnaire ci-dessous et clique sur Envoyer.");
        return;
      }
      s.messages.forEach((m) => appendBubble(m.role, m.text, m.imageUrl));
    }

    newChatBtn.onclick = () => {
      const id = "s_" + Date.now();
      sessions.unshift({ id, title: "Nouvelle discussion", messages: [] });
      activeSessionId = id;
      saveSessions();
      renderHistory();
      renderBoard();
    };

    pickFileBtn.onclick = () => {
      imageGenMode = false;
      makeImgBtn.classList.remove("active");
      fileInput.accept = "*/*";
      fileInput.click();
    };

    pickImgBtn.onclick = () => {
      imageGenMode = false;
      makeImgBtn.classList.remove("active");
      fileInput.accept = "image/*";
      fileInput.click();
    };

    makeImgBtn.onclick = () => {
      imageGenMode = !imageGenMode;
      makeImgBtn.classList.toggle("active", imageGenMode);
      promptInput.placeholder = imageGenMode
        ? "Décris l'image à créer..."
        : "Écris ton message ou ton questionnaire ici...";
    };

    fileInput.onchange = () => {
      if (fileInput.files && fileInput.files[0]) {
        attachedFile = fileInput.files[0];
        fileNameLabel.textContent = "Fichier joint : " + attachedFile.name;
        filePill.classList.add("visible");
      }
    };

    removeFileBtn.onclick = () => {
      attachedFile = null;
      fileInput.value = "";
      filePill.classList.remove("visible");
    };

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 150) + "px";
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const rawText = promptInput.value.trim();
      if (!rawText && !attachedFile) return;

      const session = getActiveSession();
      if (session.title === "Session 1" || session.title === "Nouvelle discussion") {
        session.title = (rawText || attachedFile?.name || "Discussion").slice(0, 30);
      }

      const shownUser = attachedFile
        ? (rawText ? rawText + "\n[Fichier : " + attachedFile.name + "]" : "[Fichier : " + attachedFile.name + "]")
        : (imageGenMode ? "[Créer image] " + rawText : rawText);

      session.messages.push({ role: "user", text: shownUser });
      appendBubble("user", shownUser);

      const replyBubble = appendBubble("assistant", "Réponse en cours...");

      promptInput.value = "";
      promptInput.style.height = "auto";
      sendBtn.disabled = true;
      statusBadge.textContent = "En cours...";

      try {
        let finalText = "";
        let finalImg = null;

        if (attachedFile) {
          const fd = new FormData();
          fd.append("file", attachedFile);
          fd.append("message", rawText);
          const resp = await fetch("/upload", { method: "POST", body: fd });
          const data = await resp.json();
          finalText = data.reply || data.error || "Aucune réponse reçue.";
        } else if (imageGenMode) {
          const resp = await fetch("/generate-image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: rawText })
          });
          const data = await resp.json();
          if (data.image_url) {
            finalImg = data.image_url;
            finalText = "Image générée : " + rawText;
          } else {
            finalText = data.error || "Impossible de créer l'image.";
          }
        } else {
          const resp = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: rawText })
          });
          const data = await resp.json();
          finalText = data.reply || data.response || data.error || "Aucune réponse reçue.";
        }

        replyBubble.innerHTML = "";
        if (finalText) replyBubble.innerHTML = renderRichText(finalText);
        if (finalImg) {
          const img = document.createElement("img");
          img.src = finalImg;
          img.alt = "Image générée";
          replyBubble.appendChild(img);
        }
        session.messages.push({ role: "assistant", text: finalText, imageUrl: finalImg });
      } catch (err) {
        const errText = "Erreur de connexion : " + err.message;
        replyBubble.textContent = errText;
        session.messages.push({ role: "assistant", text: errText });
      } finally {
        attachedFile = null;
        fileInput.value = "";
        filePill.classList.remove("visible");
        sendBtn.disabled = false;
        statusBadge.textContent = "Prêt";
        saveSessions();
        renderHistory();
      }
    });

    renderHistory();
    renderBoard();
  </script>
</body>
</html>
